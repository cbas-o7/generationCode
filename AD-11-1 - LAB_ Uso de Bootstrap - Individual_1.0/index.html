<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>replit</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <div class="container-fluid">
      Hello world

      <button type="button" class="theme-primary btn-solid btn-styled">
        Click me
      </button>
      <button type="button" class="theme-danger btn-solid btn-styled">
        With left icon
      </button>
      <button type="button" class="theme-accent btn-solid btn-styled">
        With right icon
      </button>
    </div>

    <p class="text-start">Izquierda</p>
    <p class="text-center bg-danger">Centro</p>
    <p class="text-end">Derecha</p>

    <div class="card" style="width: 25rem;">
      <h5 class="card-header">Hoja de ruta</h5>
      <div class="card-body">
        <img
          src="https://i.pinimg.com/736x/f4/23/e1/f423e1fb375c52969f0c33d74b482b4b.jpg"
          class="card-img"
          alt="..."
        />
      </div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item">Platano</li>
        <li class="list-group-item">Pera</li>
        <li class="list-group-item">Uvas</li>
        <li class="list-group-item">Piña</li>
      </ul>
    </div>

    <script src="script.js"></script>

    <!--
  This script places a badge on your repl's full-browser view back to your repl's cover
  page. Try various colors for the theme: dark, light, red, orange, yellow, lime, green,
  teal, blue, blurple, magenta, pink!
  -->
    <script
      src="https://replit.com/public/js/replit-badge-v2.js"
      theme="dark"
      position="bottom-right"
    ></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
